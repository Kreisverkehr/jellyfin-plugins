
name: Update plugin catalog

on:
  repository_dispatch:
    types:
      - plugin-release-published

permissions:
  contents: write

concurrency:
  group: jellyfin-plugin-catalog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout catalog
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate release information
        id: release
        env:
          PLUGIN_REPO: ${{ github.event.client_payload.plugin_repo }}
          TAG: ${{ github.event.client_payload.tag }}
          DOWNLOAD_URL: ${{ github.event.client_payload.download_url }}
        shell: bash
        run: |
          set -euo pipefail

          # Only accept repositories owned by the expected account.
          if [[ "${PLUGIN_REPO,,}" != kreisverkehr/* ]]; then
            echo "::error::Unexpected plugin repository owner"
            exit 1
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag"
            exit 1
          fi

          EXPECTED_PREFIX="https://github.com/${PLUGIN_REPO}/releases/download/${TAG}/"

          if [[ "$DOWNLOAD_URL" != "$EXPECTED_PREFIX"* ]]; then
            echo "::error::Download URL does not match repository and tag"
            exit 1
          fi

          ASSET_NAME="${DOWNLOAD_URL##*/}"

          if [[ ! "$ASSET_NAME" =~ ^[A-Za-z0-9._-]+\.zip$ ]]; then
            echo "::error::Invalid ZIP asset name"
            exit 1
          fi

          echo "url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Download release package
        env:
          URL: ${{ steps.release.outputs.url }}
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "$URL" \
            --output "$RUNNER_TEMP/$ASSET"

          test -s "$RUNNER_TEMP/$ASSET"

      - name: Install JPRM
        run: |
          python -m pip install --upgrade pip
          python -m pip install jprm

      - name: Update manifest
        env:
          URL: ${{ steps.release.outputs.url }}
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          set -euo pipefail
          jprm repo add \
            --url="$URL" \
            . \
            "$RUNNER_TEMP/$ASSET"

      - name: Commit manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.client_payload.tag }}
          PLUGIN_REPO: ${{ github.event.client_payload.plugin_repo }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add manifest.json

          if git diff --cached --quiet; then
            echo "Manifest unchanged."
            exit 0
          fi

          git commit -m "Publish ${PLUGIN_REPO} ${TAG}"
          git push origin HEAD:main
